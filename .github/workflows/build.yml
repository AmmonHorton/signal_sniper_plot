name: Build and publish wheel

on:
  push:
    tags:
      - "v*"

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # X11 headers and shared library required at build time.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      # Bazelisk reads .bazeliskrc and downloads the pinned Bazel version.
      - name: Install Bazelisk
        run: |
          sudo apt-get install -y curl
          sudo curl -fsSL -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazel

      # Build the wheel. The output is a linux_x86_64 wheel; auditwheel will
      # repair it in the next step.
      - name: Build wheel
        run: bazel build //:signal_sniper_plot_wheel

      # auditwheel bundles libsignal_sniper_plot.so into the wheel and
      # re-tags it with the appropriate manylinux platform string.
      # libX11 is on the manylinux whitelist and will not be bundled.
      - name: Repair wheel (auditwheel)
        run: |
          pip install auditwheel
          mkdir -p dist
          auditwheel repair --wheel-dir dist/ \
            $(bazel cquery --output=files //:signal_sniper_plot_wheel)

      - name: Check wheel
        run: |
          pip install twine
          twine check dist/*.whl

      - name: Upload to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: twine upload --verbose --repository testpypi dist/*.whl
