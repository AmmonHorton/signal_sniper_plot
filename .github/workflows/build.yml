name: Build and publish wheel

on:
  push:
    tags:
      - "v*"

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Builds inside PyPA's manylinux_2_28 image (glibc 2.28), so the wheel installs on
      # RHEL / CentOS Stream / Alma / Rocky 8+ and Ubuntu 20.04+, not just this runner's distro.
      # The script builds with -c opt and runs auditwheel repair; the result lands in dist/.
      - name: Build wheel (manylinux_2_28)
        run: tools/build_manylinux_wheel.sh

      - name: Check wheel
        run: |
          pip install twine
          twine check dist/*.whl

      - name: Upload to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: twine upload --verbose --repository testpypi dist/*.whl
