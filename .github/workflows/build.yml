name: Build and publish wheel

on:
  push:
    tags:
      - "v*"

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Each artifact is built inside the oldest distribution it supports (see
      # packaging/build.sh): the wheel on manylinux_2_28, the RPM on Rocky Linux 8, the .deb
      # on Ubuntu 20.04. Everything lands in dist/.
      - name: Build wheel, RPM and .deb
        run: packaging/build.sh all

      - name: Keep the RPM and .deb with this run
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.rpm
            dist/*.deb

      - name: Check wheel
        run: |
          pip install twine
          twine check dist/*.whl

      - name: Upload to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: twine upload --verbose --repository testpypi dist/*.whl
